name: Backend CI and Deploy

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: zone-backend-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest

      - name: Deploy and verify
        uses: nekiro/ssh-job@main
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command: |
            set -eu
            cd /home/ubuntu
            sudo docker-compose pull
            sudo docker-compose up -d

            attempt=1
            while [ "$attempt" -le 20 ]; do
              health="$(sudo docker exec zone-backend node -e \
                "fetch('http://127.0.0.1:2333/health/ready').then(async response => { const body = await response.text(); console.log(body); if (!response.ok) process.exit(1); }).catch(() => process.exit(1))" \
                || true)"
              if printf '%s' "$health" | grep -Fq '"ready":true' \
                && printf '%s' "$health" | grep -Fq '"version":"${{ github.sha }}"'; then
                printf '%s\n' "Zone backend is ready at ${{ github.sha }}"
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done

            sudo docker-compose ps
            printf '%s\n' 'Zone backend readiness verification failed' >&2
            exit 1
