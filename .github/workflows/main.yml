# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: docker
    steps:
      - run: docker login -u z2devils -p dckr_pat_b6lEaAmMr2P5Qp_2zeEoxE3XacM
      - run: docker build -t z2devils/zone-backend .
      - run: docker push z2devils/zone-backend

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: ssh root@host
      - run: docker login -u z2devils -p dckr_pat_b6lEaAmMr2P5Qp_2zeEoxE3XacM
      - run: docker pull z2devils/zone-backend .
      - run: docker run --name z2devils/zone-backend -p 3000:3000 -d -restart=always z2devils/zone-backend
