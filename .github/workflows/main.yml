# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Docker Image CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build and push Docker image
        run: |
          docker login -u z2devils -p dckr_pat_b6lEaAmMr2P5Qp_2zeEoxE3XacM
          docker build -t z2devils/zone-backend .
          docker push z2devils/zone-backend
      - name: config ssh
        run: |
          mkdir -p ~/.ssh
          cp id_rsa ~/.ssh/id_rsa
          cp known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa

      - name: SSH into host
        run: ssh -T root@***REMOVED*** -p 22

      - name: Pull image and run container
        run: |
          docker login -u z2devils -p dckr_pat_b6lEaAmMr2P5Qp_2zeEoxE3XacM
          docker pull z2devils/zone-backend
          docker stop z2devils/zone-backend && docker rm z2devils/zone-backend
          docker run --name z2devils/zone-backend -d -p 8080:3000 z2devils/zone-backend
