name: Backend CI and Deploy

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: zone-backend-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest

      - name: Deploy and verify
        uses: nekiro/ssh-job@e5ed62b28815f5c62940154a048e1a85a13d52ed # main @ 2025-12-21
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command: |
            set -eu
            cd /home/ubuntu
            sudo docker-compose pull zone-backend
            sudo docker-compose up -d zone-backend
            attempt=1
            while [ "$attempt" -le 20 ]; do
              health="$(sudo docker exec zone-backend node -e \
                "fetch('http://127.0.0.1:2333/health/ready').then(async response => { const body = await response.text(); console.log(body); if (!response.ok) process.exit(1); }).catch(() => process.exit(1))" \
                || true)"
              if printf '%s' "$health" | grep -Fq '"ready":true' \
                && printf '%s' "$health" | grep -Fq '"version":"${{ github.sha }}"'; then
                printf '%s\n' "Zone backend is ready at ${{ github.sha }}"
                printf '%s\n' 'Cleaning up old Docker images...'
                sudo docker image prune -f
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done

            sudo docker-compose ps
            printf '%s\n' 'Zone backend readiness verification failed' >&2
            exit 1
