# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Docker Image CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and push Docker image
        run: |
          docker login -u ${{secrets.DOCKER_USER}} -p ${{secrets.DOCKER_PASSWORD}}
          docker build -t ${{secrets.DOCKER_IMAGE_NAME}} .
          docker push ${{secrets.DOCKER_IMAGE_NAME}}

      - name: SSH Command
        uses: D3rHase/ssh-command-action@v0.2.2
        with:
          host: ${{secrets.SSH_HOST}}
          port: ${{secrets.SSH_PORT}}
          user: ${{secrets.SSH_USER}}
          private_key: ${{secrets.PRIVATE_KEY}}
          host_fingerprint: ${{secrets.PUBLIC_KEY}}
          command: |
            docker login -u ${{secrets.DOCKER_USER}} -p ${{secrets.DOCKER_PASSWORD}}
            docker pull ${{secrets.DOCKER_IMAGE_NAME}}
            docker run --name ${{secrets.DOCKER_CONTAINER_NAME}} -d -p 3000:3000 ${{secrets.DOCKER_IMAGE_NAME}}

      # - name: Check Docker image
